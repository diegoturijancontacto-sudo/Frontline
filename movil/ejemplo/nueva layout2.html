    // Detección de dispositivo móvil: si se abre esta versión de escritorio
    // desde un móvil/tablet, redirige automáticamente a la versión móvil (index.html).
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera || "";
      var isMobileUA = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone|Mobile/i.test(ua);
      var isCoarsePointer = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      var isNarrowViewport = Math.min(window.innerWidth, window.innerHeight) <= 820;
      if (isMobileUA || (isCoarsePointer && isNarrowViewport)) {
        window.location.replace("./mobile.html");
      }
    })();
  </script>

                for (const abrev of abreviaturasList) {
                    if (abrev.nombre) {
                        const nombreLower = abrev.nombre.toLowerCase();
                        if (nombreLower.includes(provLower) || provLower.includes(nombreLower)) {
                            abreviaturaEncontrada = abrev.abreviatura;
                            break;
                        }
                    }
                }
            }

            if (abreviaturaEncontrada) {
                provStr = abreviaturaEncontrada;
            } else {
                const cleanProvFallback = cleanProv.replace(/\s+/g, '').toUpperCase();
                if (cleanProvFallback.length > 0) {
                    provStr = cleanProvFallback.substring(0, 3).padEnd(3, 'X');
                }
            }
        }

        const bloque1 = `${numStr}${provStr}`;

        let artistStr = '';
        if (artista && artista.trim() !== '') {
            const cleanArtista = artista.trim();
            let abreviaturaEncontrada = null;

            for (const autor of autoresList) {
                if (autor.nombre && autor.nombre.toLowerCase() === cleanArtista.toLowerCase()) {
                    abreviaturaEncontrada = autor.abreviatura;
                    break;
                }
            }

            if (!abreviaturaEncontrada) {
                const artistaLower = cleanArtista.toLowerCase();
                for (const autor of autoresList) {
                    if (autor.nombre) {
                        const nombreLower = autor.nombre.toLowerCase();
                        if (nombreLower.includes(artistaLower) || artistaLower.includes(nombreLower)) {
                            abreviaturaEncontrada = autor.abreviatura;
                            break;
                        }
                    }
                }
            }

            if (!abreviaturaEncontrada) {
                for (const [nombreAutor, abreviatura] of Object.entries(AUTOR_ABREVIATURAS)) {
                    if (nombreAutor.toLowerCase() === cleanArtista.toLowerCase()) {
                        abreviaturaEncontrada = abreviatura;
                        break;
                    }
                }
            }

            if (abreviaturaEncontrada) {
                artistStr = abreviaturaEncontrada;
            } else {
                const wordsArtista = cleanArtista.split(/\s+/);
                const pNombre = wordsArtista[0] || '';
                const sNombre = wordsArtista[1] || '';

                const iniP1 = pNombre.charAt(0).toUpperCase();
                const iniS2 = sNombre.substring(0, 2).toUpperCase();

                artistStr = `${iniP1}${iniS2}`;
            }
        }

        let tecStr = '';
        if (tecnica && tecnica.trim() !== '') {
            const cleanTecnica = tecnica.trim();
            let abreviaturaEncontrada = null;

            for (const tec of tecnicasList) {
                if (tec.nombre && tec.nombre.toLowerCase() === cleanTecnica.toLowerCase()) {
                    abreviaturaEncontrada = tec.abreviatura;
                    break;
                }
            }

            if (!abreviaturaEncontrada) {
                const tecLower = cleanTecnica.toLowerCase();
                for (const tec of tecnicasList) {
                    if (tec.nombre) {
                        const nombreLower = tec.nombre.toLowerCase();
                        if (nombreLower.includes(tecLower) || tecLower.includes(nombreLower)) {
                            abreviaturaEncontrada = tec.abreviatura;
                            break;
                        }
                    }
                }
            }

            if (abreviaturaEncontrada) {
                tecStr = abreviaturaEncontrada;
            } else {
                const wordsTec = cleanTecnica.split(/\s+/);
                const pPalabraTec = wordsTec[0] || '';

                if (pPalabraTec.length >= 3) {
                    const p2 = pPalabraTec.substring(0, 2).toUpperCase();
                    const ult = pPalabraTec.charAt(pPalabraTec.length - 1).toUpperCase();
                    tecStr = `${p2}${ult}`;
                } else {
                    tecStr = pPalabraTec.toUpperCase().padEnd(3, 'X');
                }
            }
        }

        const bloque2 = `${artistStr}${tecStr}`;

        if (bloque2 !== '') {
            return `${bloque1}-${bloque2}`;
        }
        return bloque1;
    }

    function AutocompleteInput({
      value,
      onChange,
      suggestions,
      placeholder,
      label,
      onSuggestionSelect
    }) {
      const [showSuggestions, setShowSuggestions] = useState(false);
      const [filteredSuggestions, setFilteredSuggestions] = useState([]);
      const [selectedIndex, setSelectedIndex] = useState(-1);
      const wrapperRef = useRef(null);
      const inputRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
            setShowSuggestions(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      useEffect(() => {
        if (value && value.trim().length > 0) {
          const lowerValue = value.toLowerCase().trim();
          const filtered = suggestions.filter(s =>
            s.toLowerCase().includes(lowerValue)
          );
          setFilteredSuggestions(filtered);
          setShowSuggestions(filtered.length > 0);
        } else {
          setFilteredSuggestions([]);
          setShowSuggestions(false);
        }
        setSelectedIndex(-1);
      }, [value, suggestions]);

      const handleKeyDown = (e) => {
        if (!showSuggestions) return;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          setSelectedIndex(prev =>
            prev < filteredSuggestions.length - 1 ? prev + 1 : prev
          );
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          setSelectedIndex(prev => prev > 0 ? prev - 1 : -1);
        } else if (e.key === 'Enter' && selectedIndex >= 0) {
          e.preventDefault();
          handleSelectSuggestion(filteredSuggestions[selectedIndex]);
        } else if (e.key === 'Escape') {
          setShowSuggestions(false);
        }
      };

      const handleSelectSuggestion = (suggestion) => {
        onChange(suggestion);
        setShowSuggestions(false);
        if (onSuggestionSelect) onSuggestionSelect(suggestion);
        inputRef.current?.focus();
      };

      const highlightMatch = (text, query) => {
        if (!query || !query.trim()) return text;
        const lowerText = text.toLowerCase();
        const lowerQuery = query.toLowerCase().trim();
        const index = lowerText.indexOf(lowerQuery);
        if (index === -1) return text;
        return (
          <>
            {text.substring(0, index)}
            <span className="suggestion-highlight">
              {text.substring(index, index + query.length)}
            </span>
            {text.substring(index + query.length)}
          </>
        );
      };

      return (
        <div className="suggestion-wrapper" ref={wrapperRef}>
          <label className="text-[10px] font-bold text-slate-400 uppercase ml-1 block mb-1">
            {label}
          </label>
          <input
            ref={inputRef}
            type="text"
            placeholder={placeholder}
            className="w-full p-3 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
            value={value || ''}
            onChange={(e) => {
              onChange(e.target.value);
              if (onSuggestionSelect) onSuggestionSelect(e.target.value);
            }}
            onKeyDown={handleKeyDown}
            onFocus={() => {
              if (value && value.trim().length > 0 && filteredSuggestions.length > 0) {
                setShowSuggestions(true);
              }
            }}
          />
          {showSuggestions && filteredSuggestions.length > 0 && (
            <div className="suggestions-dropdown">
              {filteredSuggestions.map((suggestion, index) => (
                <div
                  key={suggestion}
                  className={`suggestion-item ${index === selectedIndex ? 'bg-slate-100 dark:bg-slate-700' : ''}`}
                  onClick={() => handleSelectSuggestion(suggestion)}
                  onMouseEnter={() => setSelectedIndex(index)}
                >
                  {highlightMatch(suggestion, value)}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function PriceInput({ value, onChange, currency, label }) {
      const [displayValue, setDisplayValue] = useState('');
      const [isEditing, setIsEditing] = useState(false);

      const formatPrice = (inputValue) => {
        const num = parseFloat(String(inputValue).replace(/,/g, ''));
        if (Number.isNaN(num)) return '';
        return new Intl.NumberFormat('es-MX', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(num);
      };

      useEffect(() => {
        if (isEditing) {
          return;
        }
        if (value !== undefined && value !== null && value !== '') {
          setDisplayValue(formatPrice(value));
        } else {
          setDisplayValue('');
        }
      }, [value, isEditing]);

      const handleBlur = () => {
        setIsEditing(false);
        if (!displayValue) {
          onChange('');
          return;
        }

        const clean = displayValue.replace(/,/g, '');
        const num = parseFloat(clean);
        if (!Number.isNaN(num)) {
          const formatted = formatPrice(num);
          setDisplayValue(formatted);
          onChange(num.toString());
        }
      };

      const handleChange = (e) => {
        const raw = e.target.value;
        setDisplayValue(raw);
        onChange(raw);
      };

      const getCurrencySymbol = (curr) => {
        switch(curr) {
          case 'USD': return 'USD $';
          case 'EUR': return '€';
          case 'MXN':
          default: return '$';
        }
      };

      return (
        <div>
          <label className="text-[9px] font-bold text-slate-400 uppercase ml-1">{label}</label>
          <div className="relative">
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-sm font-bold text-slate-500 dark:text-slate-400">
              {getCurrencySymbol(currency)}
            </span>
            <input
              type="text"
              inputMode="decimal"
              className="w-full p-3 pl-16 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 font-semibold"
              value={displayValue}
              onFocus={() => {
                setIsEditing(true);
                setDisplayValue((current) => current.replace(/,/g, ''));
              }}
              onChange={handleChange}
              onBlur={handleBlur}
              placeholder="0.00"
            />
          </div>
        </div>
      );
    }

      const getTagsSuggestions = (input) => {
        if (!input || !input.trim()) return [];
        const inputLower = input.toLowerCase().trim();
        const inputWords = inputLower.split(/[,\s]+/).filter(w => w.length > 0);
        const lastWord = inputWords[inputWords.length - 1] || '';

        if (!lastWord) return [];

        return allTags.filter(tag =>
          tag.toLowerCase().includes(lastWord) &&
          !input.split(/[,\s]+/).map(w => w.trim().toLowerCase()).includes(tag.toLowerCase())
        ).slice(0, 10);
      };

      const addSuggestedTag = (suggestedTag) => {
        if (!currentObra) return;
        const currentValue = (currentObra.tags || '').toString();

        const words = currentValue.split(/[,\s]+/).filter(w => w.trim().length > 0);

        if (words.length === 0) {
          handleFormChange('tags', suggestedTag);
          setTagsSuggestions([]);
          tagsInputRef.current?.focus();
          return;
        }

        const lastWord = words[words.length - 1];
        const lastWordIndex = currentValue.lastIndexOf(lastWord);

        const beforeLastWord = currentValue.substring(0, lastWordIndex);
        const afterLastWord = currentValue.substring(lastWordIndex + lastWord.length);

        const trimmedBefore = beforeLastWord.trimEnd();
        const hasSeparator = trimmedBefore.length > 0 && (trimmedBefore.endsWith(',') || trimmedBefore.endsWith(' '));

        let newValue = '';
        if (hasSeparator) {
          newValue = trimmedBefore + ' ' + suggestedTag + afterLastWord;
        } else if (trimmedBefore.length > 0) {
          newValue = trimmedBefore + ', ' + suggestedTag + afterLastWord;
        } else {
          newValue = suggestedTag + afterLastWord;
        }

        newValue = newValue.replace(/\s*,\s*/g, ', ').replace(/\s+/g, ' ').trim();

        handleFormChange('tags', newValue);
        setTagsSuggestions([]);
        tagsInputRef.current?.focus();

      const handleSaveProv = async () => {
        setProvError('');

        const name = newProvName.trim();
        if (!name) {
          setProvError('El nombre de Provenance es obligatorio');
          return;
        }
        const percentage = parseFloat(newProvPercentage);
        if (isNaN(percentage) || percentage < 0 || percentage > 100) {
          setProvError('El porcentaje debe ser un número entre 0 y 100');
          return;
        }
        const abrev = newProvAbrev.trim().toUpperCase();
        if (!abrev) {
          setProvError('La abreviatura es obligatoria');
          return;
        }
        if (abrev.length < 2 || abrev.length > 5) {
          setProvError('La abreviatura debe tener entre 2 y 5 caracteres');
          return;
        }

        setSavingProv(true);
        try {
          if (provModalMode === 'add') {
            const comId = 'com_' + (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)));

            const payload = {
              id: comId,
              provenance: name,
              porcentaje: percentage
            };

            const res = await fetch(API_URL, {
              method: 'POST',
              body: JSON.stringify({ action: 'comision_add', data: payload })
            });
            const result = await res.json();

            if (result.result === 'success') {
              const abrevId = 'abrev_' + (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)));
              const abrevPayload = {
                id: abrevId,
                nombre: name,
                abreviatura: abrev,
                tipo: comId,
                fecha_registro: new Date().toISOString()
              };

              const abrevRes = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'abreviatura_add', data: abrevPayload })
              });
              const abrevResult = await abrevRes.json();

              if (abrevResult.result === 'success') {
                const newComision = { id: comId, provenance: name, porcentaje: percentage };
                setComisiones(prev => [...prev, newComision]);

                const newAbrev = {
                  id: abrevId,
                  nombre: name,
                  abreviatura: abrev,
                  tipo: comId,
                  fecha_registro: new Date().toISOString()
                };
                setAbreviaturas(prev => [...prev, newAbrev]);

                handleFormChange('provenance', comId);

                setShowProvModal(false);
                showToast(`✅ Provenance "${name}" creado con ${percentage}% y abreviatura "${abrev}"`);
              } else {
                setProvError(abrevResult.message || 'Error al crear abreviatura');
              }
            } else {
              setProvError(result.message || 'Error al crear Provenance');
            }
          } else {
            const payload = {
              id: editingProvId,
              provenance: name,
              porcentaje: percentage
            };

            const res = await fetch(API_URL, {
              method: 'POST',
              body: JSON.stringify({ action: 'comision_update', data: payload })
            });
            const result = await res.json();

            if (result.result === 'success') {
              const abrev = abreviaturas.find(a => a.tipo === editingProvId);
              if (abrev) {
                const abrevPayload = {
                  id: abrev.id,
                  nombre: name,
                  abreviatura: newProvAbrev.trim().toUpperCase(),
                  tipo: editingProvId
                };

                const abrevRes = await fetch(API_URL, {
                  method: 'POST',
                  body: JSON.stringify({ action: 'abreviatura_update', data: abrevPayload })
                });
                const abrevResult = await abrevRes.json();

        const val = parseFloat(v);
        if (!Number.isFinite(val)) return '-';
        try {
          const formatted = new Intl.NumberFormat('es-MX', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }).format(val);

          switch(currencyCode) {
            case 'USD':
              return `USD $${formatted}`;
            case 'EUR':
              return `€${formatted}`;
            case 'MXN':
            default:
              return `$${formatted}`;
          }
        }
        catch(e) { return `$${val.toLocaleString('es-MX')} ${currencyCode}`; }

      const generateAdjuntoName = (tipoCode, originalName) => {
        const claveBase = currentObra?.clave || 'OBRA';
        const extMatch = originalName.match(/\.[^/.]+$/);
        const ext = extMatch ? extMatch[0].toLowerCase() : '';

        const existingAdjCount = (currentObra?.adjuntos || []).filter(a => {
          const nameWithoutExt = (a.name || '').replace(/\.[^/.]+$/, '');
          return nameWithoutExt.includes(`-${tipoCode}`);
        }).length;

        const pendingCount = pendingFiles.filter(p => p.typeCode === tipoCode).length;

        const nextNum = existingAdjCount + pendingCount + 1;
        const seqStr = String(nextNum).padStart(2, '0');

        return `${claveBase}-${tipoCode}${seqStr}${ext}`;
      };

        const actorId = getActorId();

          const base64 = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = ev => resolve(ev.target.result.split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });

                  const base64 = await new Promise((res, rej) => {
                    const r = new FileReader(); r.onload = ev => res(ev.target.result.split(',')[1]); r.onerror = rej; r.readAsDataURL(file);
                  });
                  await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                      action: 'registro_obra_upload_adjunto',
                      data: {
                        id_obra: payload.id,
                        id_actor: actorId,
                        filename: file.customName || file.name,
                        mimeType: file.type || 'application/octet-stream',
                        base64
                      }
                    })
                  });
                } catch (_) {}
              }
            }

            showToast("Obra guardada correctamente");
            await fetchAllData();
            setView("list");
          } else { showToast("Error: " + (result?.message || 'Desconocido'), "error"); }
        } catch (e) { showToast("Error al guardar la obra", "error"); }
        finally { setSaving(false); }

        const resp = responsables.find(r => r.id === currentObra.id_responsable)?.nombre || currentObra.id_responsable || "Sin asignar";
        const verificadaStr = currentObra.verificada ? '✅ Verificada' : '❌ No verificada';

        let comisionStr = 'N/A';

            comisionStr = `${formatCurrency(cv, currentObra.tipo_moneda)} (monto fijo)`;

            const pv = parseFloat(currentObra.precio_lista) || 0;
            const monto = (pv * cv) / 100;
            comisionStr = `${cv}% → ${formatCurrency(monto, currentObra.tipo_moneda)}`;

      const handleGenerateCertificate = async () => {
        if (!currentObra || generatingCertificate) return;

        const certificateDocuments = (currentObra.documentos || []).filter(doc =>
          doc && (doc.tipo === 'Certificado' || doc.tipo === 'Certificado Web' || doc.tipo === 'Certificado PDF')
        );
        const existingPdf = certificateDocuments.find(doc => doc.tipo === 'Certificado PDF') ||
          certificateDocuments.find(doc => doc.tipo === 'Certificado');
        const existingWeb = certificateDocuments.find(doc => doc.tipo === 'Certificado Web');
        if (existingPdf?.url && existingWeb?.url) {
          const link = document.createElement('a');
          link.href = existingPdf.url;
          link.target = '_blank';
          link.download = existingPdf.nombre || 'certificado.pdf';
          document.body.appendChild(link);
          link.click();
          link.remove();
          showToast(existingWeb ? 'Certificado existente descargado' : 'PDF del certificado existente descargado');
          return;
        }

        setGeneratingCertificate(true);
        showToast('Generando certificado...');

        const originalImage = (currentObra.adjuntos || []).find(adjunto => adjunto?.typeCode === 'RW') ||
          (currentObra.adjuntos || []).find(adjunto =>
            adjunto?.mimeType?.includes('image') || /\.(jpg|jpeg|png|gif|webp)$/i.test(adjunto?.name || '')
          );
        const certificateCategory = getCertificateCategory(currentObra.tags);
        const certificatePayload = {
          id: currentObra.id,
          nombre_obra: currentObra.nombre_obra,
          tipo_obra: certificateCategory || currentObra.tipo_obra,
          categoria: certificateCategory,
          provenance: comisiones.find(c => c.id === currentObra.provenance)?.provenance || currentObra.provenance,
          autor: currentObra.autor,
          clave: currentObra.clave,
          alto: currentObra.alto,
          ancho: currentObra.ancho,
          largo: currentObra.largo,
          adjuntos: originalImage ? [originalImage] : []
        };

        try {
          const response = await fetch(CERTIFICATE_API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'certificado_generar', data: certificatePayload })
          });
          const result = await response.json();
          if (!result.ok || !result.pdfUrl) throw new Error(result.message || 'El servidor no devolvió el PDF');

          const actorId = getActorId();
          const today = new Date().toISOString().split('T')[0];
          const webDocument = {
            id: 'cert_web_' + result.id,
            tipo: 'Certificado Web',
            nombre: `Certificado web - ${currentObra.nombre_obra || currentObra.clave || result.id}`,
            url: result.certificateUrl,
            fecha: today
          };
          const pdfDocument = {
            id: 'cert_pdf_' + result.id,
            tipo: 'Certificado PDF',
            nombre: `Certificado - ${currentObra.nombre_obra || currentObra.clave || result.id}.pdf`,
            url: result.pdfUrl,
            fecha: today
          };
          const documentsToRegister = [webDocument, pdfDocument].filter(documento =>
            documento.tipo === 'Certificado Web'
              ? !existingWeb?.url
              : !existingPdf?.url
          );
          const registeredDocuments = [];
          try {
            if (actorId) {
              for (const documento of documentsToRegister) {
                const documentResponse = await fetch(API_URL, {
                  method: 'POST',
                  body: JSON.stringify({
                    action: 'registro_obra_documento_add',
                    data: { id_obra: currentObra.id, id_actor: actorId, documento }
                  })
                });
                const documentResult = await documentResponse.json();
                if (documentResult.result === 'success') registeredDocuments.push(documento);
              }
            }
          } catch (error) {
          }

          if (registeredDocuments.length > 0) {
            const updatedDocuments = [...(currentObra.documentos || []), ...registeredDocuments];
            const updatedObra = { ...currentObra, documentos: updatedDocuments };
            setCurrentObra(updatedObra);
            setObras(prev => prev.map(obra => obra.id === currentObra.id ? updatedObra : obra));
          }

          const downloadLink = document.createElement('a');
          downloadLink.href = result.pdfUrl;
          downloadLink.download = pdfDocument.nombre;
          downloadLink.target = '_blank';
          document.body.appendChild(downloadLink);
          downloadLink.click();
          downloadLink.remove();
          showToast(registeredDocuments.length === documentsToRegister.length ? 'Certificado generado y registrado' : 'Certificado generado; no se registraron todos los enlaces');
        } catch (error) {
          showToast(error.message || 'Error al generar el certificado', 'error');
        } finally {
          setGeneratingCertificate(false);
        }

                        <div>
                          <label className="text-[9px] font-bold text-zinc-500 uppercase ml-1">Peso</label>
                          <input type="number" step="any" className="w-full p-3 bg-zinc-900/80 border border-zinc-700 rounded-xl outline-none text-zinc-100" value={currentObra.superficie || ''} onChange={e => handleFormChange('superficie', e.target.value)} />
                        </div>
                      </div>
                    </section>

                    <section className="bg-zinc-950 p-6 rounded-3xl border border-zinc-800 shadow-sm space-y-4">
                      <h3 className="text-xs font-bold text-zinc-500 uppercase tracking-widest">Estado y ubicación</h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                          <label className="text-[10px] font-bold text-zinc-500 uppercase ml-1">Estatus *</label>
                          <select className="w-full p-4 bg-zinc-900/80 border border-zinc-700 rounded-2xl outline-none text-zinc-100" value={currentObra.estatus || 'Disponible'} onChange={e => handleFormChange('estatus', e.target.value)}>
                            <option value="Disponible">Disponible</option>
                            <option value="Vendida">Vendida</option>
                            <option value="En Restauración">En Restauración</option>
                            <option value="Apartada">Apartada</option>
                            <option value="En mora">En mora</option>
                          </select>
                        </div>
                        <div>
                          <label className="text-[10px] font-bold text-zinc-500 uppercase ml-1">Ubicación</label>
                          <select className="w-full p-4 bg-zinc-900/80 border border-zinc-700 rounded-2xl outline-none text-zinc-100" value={currentObra.ubicacion || ''} onChange={e => handleFormChange('ubicacion', e.target.value)}>
                            <option value="">Seleccionar ubicación</option>
                            {ubicacionOptions.map(opt => (
                              <option key={opt} value={opt}>{opt}</option>
                            ))}
                          </select>
                        </div>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                          <label className="text-[10px] font-bold text-zinc-500 uppercase ml-1">Responsable</label>
                          <select className="w-full p-3 bg-zinc-900/80 border border-zinc-700 rounded-xl outline-none text-xs text-zinc-100" value={currentObra.id_responsable || ''} onChange={e => handleFormChange('id_responsable', e.target.value)}>
                            <option value="">Sin Responsable</option>
                            {responsables.map(r => (
                              <option key={r.id} value={r.id}>{r.nombre}</option>
                            ))}
                          </select>
                        </div>
                        <div>
                          <label className="text-[10px] font-bold text-zinc-500 uppercase ml-1">WORK ID (Autogenerado)</label>
                          <input readOnly type="text" className="w-full p-4 bg-zinc-800 border-none rounded-2xl outline-none text-indigo-400 font-mono font-bold" value={currentObra.clave || ''} />
                        </div>
                      </div>
                    </section>

                    <section className="bg-zinc-950 p-6 rounded-3xl border border-zinc-800 shadow-sm space-y-4">
                      <h3 className="text-xs font-bold text-zinc-500 uppercase tracking-widest">Metadata</h3>
                      <div className="space-y-4">
                        <div className="relative">
                          <label className="text-[10px] font-bold text-zinc-500 uppercase ml-1">Tags</label>
                          <input
                            ref={tagsInputRef}
                            type="text"
                            placeholder="abstracto, oleo, gran_formato"
                            className="w-full p-3 bg-zinc-900/80 border border-zinc-700 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-zinc-100"
                            value={currentObra.tags || ''}
                            onChange={e => {
                              handleFormChange('tags', e.target.value);
                              const suggestions = getTagsSuggestions(e.target.value);
                              setTagsSuggestions(suggestions);
                            }}
                            onFocus={e => {
                              const suggestions = getTagsSuggestions(e.target.value);
                              setTagsSuggestions(suggestions);
                            }}
                            onBlur={() => {
                              setTimeout(() => setTagsSuggestions([]), 200);
                            }}
                          />

                          {tagsSuggestions.length > 0 && (
                            <div className="tags-suggestions">
                              {tagsSuggestions.map(tag => (
                                <div
                                  key={tag}
                                  className="tags-suggestion-item"
                                  onMouseDown={(e) => {
                                    e.preventDefault();
                                    addSuggestedTag(tag);
                                  }}
                                >
                                  <span className="hash">#</span>
                                  <span>{tag}</span>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                        <div>
                          <label className="text-[10px] font-bold text-zinc-500 uppercase ml-1">Observaciones</label>
                          <textarea rows="3" className="w-full p-3 bg-zinc-900/80 border border-zinc-700 rounded-xl outline-none text-zinc-100" value={currentObra.observaciones || ''} onChange={e => handleFormChange('observaciones', e.target.value)} />
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2" />
                      </div>
                    </section>

                    <section className="bg-zinc-950 p-6 rounded-3xl border border-zinc-800 shadow-sm space-y-4 lg:col-span-2">
                      <h3 className="text-xs font-bold text-zinc-500 uppercase tracking-widest">Documentación</h3>
                      <div className="grid gap-4 lg:grid-cols-2">
                        <div className="bg-zinc-900/50 rounded-2xl p-4 border border-zinc-800 space-y-4">
                          <div className="flex items-start justify-between gap-3">
                            <div>
                              <p className="text-xs font-bold text-zinc-400 uppercase">Imagen Original</p>
                              <p className="text-[10px] text-zinc-500 mt-1">Solo acepta un archivo y se bloquea después de subirlo.</p>
                            </div>
                            <IconPaperclip className="w-5 h-5 text-zinc-400 shrink-0" />
                          </div>

                          {getImageOriginalAdjunto() && (
                            <div className="space-y-2">
                              {(() => {
                                const primaryAdjunto = getImageOriginalAdjunto();
                                if (!primaryAdjunto) return null;
                                return (
                                  <div className="flex justify-between items-center p-3 bg-zinc-800 rounded-xl text-xs border border-zinc-700">
                                    <span className="truncate font-mono font-medium min-w-0 pr-2 text-zinc-200">{primaryAdjunto.name || primaryAdjunto.id}</span>
                                    <span className="text-[10px] font-bold text-emerald-400 uppercase">Bloqueada</span>
                                  </div>
                                );
                              })()}
                            </div>
                          )}

                          {isExistingObra() && getImageAdjuntos().length > 1 && (
                            <div className="space-y-2">
                              <button
                                type="button"
                                onClick={() => setShowCoverPicker(!showCoverPicker)}
                                className="w-full py-2.5 bg-zinc-800 border border-indigo-900/50 text-indigo-400 rounded-xl text-xs font-bold transition-colors hover:bg-indigo-900/20"
                              >
                                {showCoverPicker ? 'Cerrar selección de portada' : 'Cambiar portada'}
                              </button>

                              {showCoverPicker && (
                                <div className="space-y-2 max-h-64 overflow-y-auto rounded-xl border border-zinc-700 p-2 bg-zinc-950">
                                  {getImageAdjuntos().map(adjunto => {
                                    const isCover = getImageOriginalAdjunto()?.id === adjunto.id;
                                    const imageUrl = adjunto.id
                                      ? `https://drive.google.com/thumbnail?id=${adjunto.id}&sz=w400`
                                      : adjunto.url;
                                    return (
                                      <button
                                        key={adjunto.id}
                                        type="button"
                                        onClick={() => handleChangeCover(adjunto.id)}
                                        className={`w-full flex items-center gap-3 p-2 rounded-xl text-left border transition-colors ${isCover ? 'border-emerald-500 bg-emerald-900/20' : 'border-transparent hover:border-indigo-800 hover:bg-zinc-800'}`}
                                      >
                                        {imageUrl ? <img src={imageUrl} alt={adjunto.name || 'Adjunto'} className="w-14 h-14 rounded-lg object-cover shrink-0" /> : <div className="w-14 h-14 rounded-lg bg-zinc-700 shrink-0" />}
                                        <span className="min-w-0 flex-1">
                                          <span className="block truncate text-xs font-semibold text-zinc-200">{adjunto.name || adjunto.id}</span>
                                          <span className={`block text-[10px] font-bold uppercase ${isCover ? 'text-emerald-400' : 'text-zinc-500'}`}>{isCover ? 'Portada actual' : 'Usar como portada'}</span>
                                        </span>
                                      </button>
                                    );
                                  })}
                                </div>
                              )}
                            </div>
                          )}

                          {getPrimaryPendingImageOriginal() && (
                            <div className="space-y-2">
                              <div className="flex justify-between items-center p-3 bg-zinc-800 rounded-xl text-xs border border-zinc-700">
                                <span className="truncate font-mono font-medium min-w-0 pr-2 text-zinc-200">{getPrimaryPendingImageOriginal().customName || getPrimaryPendingImageOriginal().name}</span>
                                <button type="button" onClick={() => setPendingFiles(pendingFiles.filter(file => file !== getPrimaryPendingImageOriginal()))} className="text-red-400 hover:text-red-300 p-1 shrink-0"><IconTrash /></button>
                              </div>
                            </div>
                          )}

                          {!hasImageOriginalAdjunto() && (
                            <>
                              <input ref={imageInputRef} type="file" accept="image/*" className="hidden" onChange={handleUploadImagenOriginal} />
                              <button
                                type="button"
                                disabled={uploadingAdj}
                                onClick={() => imageInputRef.current?.click()}
                                className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white border border-indigo-600 rounded-xl text-xs font-bold transition-all shadow-md active:scale-95 flex justify-center items-center gap-2 disabled:opacity-50"
                              >
                                {uploadingAdj ? 'Subiendo...' : '⬆ Subir Imagen Original'}
                              </button>
                            </>
                          )}

                          <div className="rounded-2xl overflow-hidden border border-zinc-700 bg-zinc-800 aspect-[4/3] relative">
                            {portadaPreviewUrl ? (
                              <img src={portadaPreviewUrl} alt="Portada de la obra" className="absolute inset-0 w-full h-full object-cover" />
                            ) : (
                              <div className="absolute inset-0 flex flex-col items-center justify-center text-center p-4">
                                <IconFileText className="w-10 h-10 text-zinc-500 mb-2" />
                                <p className="text-sm font-semibold text-zinc-400">Portada debajo de Imagen Original</p>
                                <p className="text-xs text-zinc-500 mt-1">Se mostrará aquí cuando subas la primera imagen.</p>
                              </div>
                            )}
                          </div>

                          <p className="text-[10px] text-zinc-500">La portada se toma automáticamente de la Imagen Original.</p>
                        </div>

                        <div className="bg-zinc-900/50 rounded-2xl p-4 border border-zinc-800 space-y-4">
                          <div className="flex items-start justify-between gap-3">
                            <div>
                              <p className="text-xs font-bold text-zinc-400 uppercase">Documentos técnicos</p>
                              <p className="text-[10px] text-zinc-500 mt-1">
                                {hasImageOriginalAdjunto()
                                  ? 'Ya puedes subir los adjuntos posteriores al primero.'
                                  : 'Se desbloqueará después de subir la Imagen Original.'}
                              </p>
                            </div>
                            <IconFileText className="w-5 h-5 text-zinc-400 shrink-0" />
                          </div>

                          <div>
                            <label className="text-[10px] font-bold text-zinc-500 uppercase ml-1 mb-1 block">Nomenclatura</label>
                            <select
                              className="w-full p-3 bg-zinc-800 border border-zinc-700 rounded-xl outline-none text-xs font-semibold text-zinc-100"
                              value={selectedTechAdj}
                              onChange={e => setSelectedTechAdj(e.target.value)}
                              disabled={!hasImageOriginalAdjunto()}
                            >
                              <option value="RW">Imagen original RW</option>
                              <option value="RD">Imagen Editada RD</option>
                              <option value="FO">Foto de obra FO</option>
                              <option value="VD">video VD</option>
                              <option value="CER">Certificado CER</option>
                              <option value="COT">Cotización COT</option>
                            </select>
                          </div>

                          {getTechnicalPendingFiles().length > 0 && (
                            <div className="space-y-2">
                              {getTechnicalPendingFiles().map((f, i) => (
                                <div key={i} className="flex justify-between items-center p-3 bg-zinc-800 rounded-xl text-xs border border-zinc-700">
                                  <span className="truncate font-mono font-medium min-w-0 pr-2 text-zinc-200">{f.customName || f.name}</span>
                                  <button type="button" onClick={() => setPendingFiles(pendingFiles.filter(file => file !== f))} className="text-red-400 hover:text-red-300 p-1 shrink-0"><IconTrash /></button>
                                </div>
                              ))}
                            </div>
                          )}

                          {getTechnicalStoredAdjuntos().length > 0 && (
                            <div className="space-y-2">
                              {getTechnicalStoredAdjuntos().map(adj => (
                                <div key={adj.id} className="flex justify-between items-center p-3 bg-zinc-800 rounded-xl text-xs border border-zinc-700">
                                  <span className="truncate font-mono font-medium min-w-0 pr-2 text-zinc-200">{adj.name || adj.id}</span>
                                  <button type="button" onClick={() => handleDeleteAdjunto(adj.id)} className="text-red-400 hover:text-red-300 p-1 shrink-0"><IconTrash /></button>
                                </div>
                              ))}
                            </div>
                          )}

                          <input ref={techInputRef} type="file" multiple className="hidden" onChange={handleUploadTecnicos} />
                          <button
                            type="button"
                            disabled={!hasImageOriginalAdjunto() || uploadingAdj}
                            onClick={() => techInputRef.current?.click()}
                            className={`w-full py-3 border rounded-xl text-xs font-bold transition-all shadow-md active:scale-95 flex justify-center items-center gap-2 ${hasImageOriginalAdjunto() && !uploadingAdj ? 'bg-indigo-600 hover:bg-indigo-700 text-white border-indigo-600' : 'bg-zinc-700 text-zinc-500 border-zinc-600 cursor-not-allowed'}`}
                          >
                            {uploadingAdj ? 'Subiendo...' : '⬆ Subir Documentos técnicos'}
                          </button>
                          {!hasImageOriginalAdjunto() && (
                            <p className="text-[10px] text-amber-400 font-semibold uppercase tracking-widest">Se desbloqueará después de subir la Imagen Original</p>
                          )}
                        </div>
                      </div>
                    </section>

                    {obras.some(o => o.id === currentObra.id) && (
                      <button type="button" onClick={handleDeleteObra} className="w-full py-3 text-red-400 font-bold text-xs hover:underline text-center lg:col-span-2">
                        Eliminar Registro de Obra
                      </button>
                    )}
                  </form>
                </div>
              )}

              <Toast {...toast} onClose={() => setToast({ message: '', type: '' })} />
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
          .catch(err => console.log('Error al registrar el Service Worker:', err));
      });
    }

    // Inicializar iconos de Lucide después de que React monte
    setTimeout(() => {
      if (window.lucide) lucide.createIcons();
    }, 100);
  </script>
</body>
</html>
